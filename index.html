<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Flipbook pourri</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- jQuery 2.2.4 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>

    <!-- jQuery Migrate 1.x : restaure $.browser (supprimé depuis jQuery 1.9), nécessaire pour turn.js -->
    <script src="https://code.jquery.com/jquery-migrate-1.4.1.min.js"></script>

    <!-- PDF.js et son worker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <!-- Turn.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
</head>
<body>

    <div id="upload-container">
        <label for="pdf-file-input" class="upload-btn">Choisir un PDF</label>
        <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;">
    </div>

    <div id="flipbook-container">
        <div id="flipbook">
            <!-- Les pages seront injectées ici -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
