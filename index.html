<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Flipbook</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Remplacer jQuery 3.6.0 par jQuery 2.2.4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    
    <!-- PDF.js et son worker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <!-- Turn.js via jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/turn.js@4.10.2/turn.min.js"></script>
</head>
<body>

    <div id="upload-container">
        <label for="pdf-file-input" class="upload-btn">Choisir un PDF</label>
        <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;">
    </div>

    <div id="flipbook-container">
        <div id="flipbook">
            <!-- Les pages seront injectées ici -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
