<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Casse-briques TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1628;--card:#131E33;--border:#1E3050;--fg:#E2E8F0;--muted:#64748B;--accent:#10B981;--accent2:#14B8A6;--danger:#F43F5E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Outfit',system-ui,sans-serif;color:var(--fg)}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:8px;gap:6px}
#top{position:relative;display:flex;align-items:center;justify-content:center;height:50px}
#back{position:absolute;left:0;top:50%;transform:translateY(-50%);background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:12px;width:48px;height:48px;font-size:8px;line-height:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .2s;z-index:10}
#back:hover{background:var(--border);color:var(--fg)}
#title{font-size:20px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#infos{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#infos::-webkit-scrollbar{display:none}
.pill{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:5px;cursor:default}
.pill.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.clickable{cursor:pointer;transition:background .15s}
.pill.clickable:hover{background:var(--border)}
#viesDots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);transition:background .3s}
.dot.off{background:var(--border)}
.iconBtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);cursor:pointer;background:var(--card);display:grid;place-items:center;font-size:14px;flex-shrink:0;transition:all .2s}
.iconBtn:hover{background:var(--border)}
#missionBar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:12px;line-height:1.3;display:flex;align-items:center;gap:6px}
#missionBar .label{color:var(--danger);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.6px;flex-shrink:0}
#progressWrap{display:flex;flex-direction:column;gap:3px}
#track{height:7px;background:var(--card);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
#fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .3s ease;position:relative}
#fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#progLabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700}
#gameWrap{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;border:1px solid var(--border)}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,22,40,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:30;color:white;text-align:center;padding:24px}
#overlay.show{display:grid}
#ovTitle{font-size:24px;font-weight:900;letter-spacing:-.5px}
#ovText{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.5}
.btnPrimary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:999px;padding:11px 26px;font-weight:800;font-size:14px;cursor:pointer;margin-top:14px;font-family:inherit;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(16,185,129,.3)}
.btnPrimary:hover{transform:scale(1.04);box-shadow:0 6px 28px rgba(16,185,129,.5)}
.btnPrimary:active{transform:scale(.97)}
#comboDisplay{position:absolute;top:10px;right:12px;font-size:16px;font-weight:900;color:#FBBF24;opacity:0;transition:opacity .15s;pointer-events:none;text-shadow:0 0 10px rgba(251,191,36,.5)}
#comboDisplay.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="back" onclick="location.href='https://pierreg78-maker.github.io/Atelier/'">Retour<br>accueil</button>
    <div id="title">Casse-briques Santé</div>
  </div>
  <div id="infos">
    <div class="pill" id="scorePill">SCORE <span id="score">0</span></div>
    <div class="pill accent" id="niveauPill">Niveau 1</div>
    <div class="pill" id="viesPill">VIES <span id="viesDots"></span></div>
    <button class="iconBtn" id="muteBtn" aria-label="Son on/off">🔇</button>
    <div class="pill clickable" id="restartBtn">Recommencer</div>
  </div>
  <div id="missionBar">
    <span class="label">Mission</span>
    <span id="missionText"></span>
  </div>
  <div id="progressWrap">
    <div id="track"><div id="fill"></div></div>
    <div id="progLabels"><span id="pct">0% détruit</span><span>Objectif 90%</span></div>
  </div>
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>
    <div id="comboDisplay"></div>
    <div id="overlay">
      <div>
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <button class="btnPrimary" id="ovBtn">Continuer</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== NIVEAUX ===== */
const LEVELS=[
  {name:"Leucémie",fond:"https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/images/1_fond_sain_leucemie.jpg",cible:"https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/images/1_cible_leucemie.png",mission:"Viser les blastes (en mauve).",size:.76,x:.32,y:.38,blur:2,speed:1,color:'#C084FC'},
  {name:"Cancer colo",fond:"https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/images/2_fond_sain_cancer_colo.png",cible:"https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/images/2_cible_cancer_colo.png",mission:"Viser les polypes (en rouge).",size:.64,x:.62,y:.34,blur:1.5,speed:1.2,color:'#F43F5E'},
  {name:"Cancer prostate",fond:"https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/images/3_fond_sain_cancer_prostate.png",cible:"https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/images/3_cible_cancer_prostate.png",mission:"Viser la tumeur (en gris).",size:.52,x:.30,y:.44,blur:1,speed:1.4,color:'#06B6D4'},
  {name:"Alzheimer",fond:"https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/images/4_fond_sain_Alzheimer.png",cible:"https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/images/4_cible_Alzheimer.png",mission:"Viser l'amas de protéines Tau (en rouge).",size:.40,x:.66,y:.40,blur:0,speed:1.65,color:'#F97316'},
];

/* ===== SONS ===== */
const SOUNDS={
  boom:new Audio("https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/sons/boom.wav"),
  oneup:new Audio("https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/sons/1up.wav"),
  longer:new Audio("https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/sons/longer.wav"),
  multi:new Audio("https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/sons/multiball.wav"),
  pass:new Audio("https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/sons/passage_niveau.wav"),
  lost:new Audio("https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/sons/perdu.wav"),
  applause:new Audio("https://raw.githubusercontent.com/pierreg78-maker/casse-briques_sante/main/sons/applause.wav"),
};
Object.values(SOUNDS).forEach(a=>{a.crossOrigin="anonymous";a.preload="auto";});
let muted=true;
function setMuted(m){muted=m;Object.values(SOUNDS).forEach(a=>a.muted=m);document.getElementById('muteBtn').textContent=m?'🔇':'🔊';}
setMuted(true);

/* ===== ÉLÉMENTS CANVAS ===== */
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('gameWrap');
const comboEl=document.getElementById('comboDisplay');

/* ===== ÉTAT ===== */
let DPR=1,W=0,H=0;
let levelIdx=0,score=0,vies=5;
let balls=[],paddle={x:0,w:110,h:14},gifts=[];
let targetImg=new Image(),bgImg=new Image();
// Canvas hors-écran pour la cible (on efface dessus au fur et à mesure)
let targetCanvas=document.createElement('canvas'),tctx=targetCanvas.getContext('2d');
let targetW=0,targetH=0,targetX=0,targetY=0;
let totalPixels=1,remainingPixels=1;
let longTimer=0,running=false,last=0;

/* ===== EFFETS VISUELS ===== */
let particles=[],impacts=[],floatingTexts=[];
let combo=0,comboTimer=0,screenFlash=0,targetPulse=0;

/* ===== UTILITAIRES ===== */
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

/* ===== REDIMENSIONNEMENT ===== */
function positionTarget(){
  const L=LEVELS[levelIdx];
  targetX=W*L.x-targetW/2;
  targetY=H*L.y-targetH/2;
  const marginX=10,marginTop=10,marginBottom=70; // marge sous la cible pour laisser la balle rebondir avant la raquette
  targetX=Math.min(Math.max(targetX,marginX),W-targetW-marginX);
  targetY=Math.min(Math.max(targetY,marginTop),H-targetH-marginBottom);
}
function resizeGame(){
  const r=wrap.getBoundingClientRect();
  DPR=window.devicePixelRatio||1;
  W=r.width;H=r.height;
  if(W<10||H<10)return;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!paddle.x)paddle.x=W/2-paddle.w/2;
  paddle.x=Math.min(Math.max(paddle.x,0),W-paddle.w);
  // Repositionner la cible si déjà chargée
  if(targetW>0){
    positionTarget();
  }
}
const ro=new ResizeObserver(()=>{clearTimeout(window._rz);window._rz=setTimeout(resizeGame,100);});
ro.observe(wrap);
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(resizeGame,100);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(resizeGame,100);});
window.addEventListener('orientationchange',()=>setTimeout(resizeGame,250));

/* ===== UI ===== */
function updateVies(){
  const c=document.getElementById('viesDots');c.innerHTML='';
  for(let i=0;i<5;i++){const d=document.createElement('div');d.className='dot'+(i<vies?'':' off');c.appendChild(d);}
}
function updateProgress(){
  const pct=Math.min((1-remainingPixels/totalPixels)*100,100);
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('pct').textContent=Math.floor(pct)+'% détruit';
  return pct;
}

/* ===== CHARGEMENT NIVEAU ===== */
function loadLevel(idx){
  levelIdx=idx;
  const L=LEVELS[idx];
  document.getElementById('niveauPill').textContent='Niveau '+(idx+1);
  document.getElementById('missionText').textContent=L.mission;
  document.getElementById('fill').style.width='0%';
  document.getElementById('pct').textContent='0% détruit';
  bgImg.crossOrigin="anonymous";bgImg.src=L.fond;
  targetImg.crossOrigin="anonymous";targetImg.src=L.cible;

  // Réinitialiser effets et états
  particles=[];impacts=[];floatingTexts=[];
  combo=0;comboTimer=0;screenFlash=0;gifts=[];longTimer=0;
  remainingPixels=0;totalPixels=1; // tant que l'image n'est pas chargée

  targetImg.onload=function(){
    const tw=W*L.size;
    const sc=tw/targetImg.width;
    targetW=tw;targetH=targetImg.height*sc;
    positionTarget();
    targetCanvas.width=targetW;
    targetCanvas.height=targetH;
    tctx.clearRect(0,0,targetW,targetH);
    tctx.drawImage(targetImg,0,0,targetW,targetH);
    // Compter les pixels réels de la cible (alpha > 20)
    const data=tctx.getImageData(0,0,targetW,targetH).data;
    let cnt=0;
    for(let i=3;i<data.length;i+=4) if(data[i]>20) cnt++;
    totalPixels=cnt||1;
    remainingPixels=totalPixels;
    updateProgress();
    resetBalls();
  };
  resetBalls();
}

function resetBalls(){
  const spd=LEVELS[levelIdx].speed;
  balls=[{x:W/2,y:H-50,vx:(Math.random()>.5?1:-1)*3.5*spd,vy:-4*spd,trail:[],hitCd:0}];
  paddle.w=110;
}

function play(s){if(!muted){try{SOUNDS[s].currentTime=0;SOUNDS[s].play();}catch(e){}}}

/* ===== EFFETS : SPAWN ===== */
function spawnParticles(x,y,color,count){
  for(let i=0;i<(count||10);i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*4.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,decay:.013+Math.random()*.022,size:1.5+Math.random()*4,color});
  }
}
function spawnImpact(x,y,color){
  impacts.push({x,y,r:4,alpha:.7,color});
}
function spawnFloat(x,y,text,color){
  floatingTexts.push({x,y,text,color:color||'#10B981',alpha:1,vy:-1.6,scale:1.3});
}

/* ===== EFFETS : UPDATE & DRAW ===== */
function updateEffects(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.09*dt;p.life-=p.decay*dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=impacts.length-1;i>=0;i--){
    const imp=impacts[i];imp.r+=2.8*dt;imp.alpha-=.032*dt;
    if(imp.alpha<=0)impacts.splice(i,1);
  }
  for(let i=floatingTexts.length-1;i>=0;i--){
    const ft=floatingTexts[i];ft.y+=ft.vy*dt;ft.alpha-=.016*dt;ft.scale=Math.max(1,ft.scale-.025*dt);
    if(ft.alpha<=0)floatingTexts.splice(i,1);
  }
  if(screenFlash>0)screenFlash-=.025*dt;
  if(comboTimer>0)comboTimer-=dt;else combo=0;
  targetPulse+=.04*dt;
}

function drawEffects(){
  // Anneaux d'impact
  for(const imp of impacts){
    const [r,g,b]=hexRgb(imp.color);
    ctx.strokeStyle='rgba('+r+','+g+','+b+','+imp.alpha+')';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(imp.x,imp.y,imp.r,0,Math.PI*2);ctx.stroke();
  }
  // Particules
  for(const p of particles){
    ctx.globalAlpha=p.life*p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.size*p.life),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // Textes flottants
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const ft of floatingTexts){
    ctx.globalAlpha=ft.alpha;
    ctx.fillStyle=ft.color;
    ctx.font='800 '+Math.round(14*ft.scale)+'px Outfit';
    ctx.fillText(ft.text,ft.x,ft.y);
  }
  ctx.globalAlpha=1;
}

/* ===== BOUCLE PRINCIPALE ===== */
function loop(t){
  requestAnimationFrame(loop);
  if(!running){last=t;return;}
  const dt=Math.min((t-last)/16.6,2.5);
  last=t;
  const L=LEVELS[levelIdx];

  /* --- Fond --- */
  if(bgImg.complete&&bgImg.naturalWidth){
    ctx.save();ctx.filter='blur('+L.blur+'px)';ctx.drawImage(bgImg,0,0,W,H);ctx.restore();
    // Vignette pour profondeur
    const vg=ctx.createRadialGradient(W/2,H/2,W*.15,W/2,H/2,W*.85);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.45)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }else{
    ctx.fillStyle='#0A1628';ctx.fillRect(0,0,W,H);
  }

  /* --- Cible avec glow pulsant --- */
  if(targetW>0&&targetH>0){
    const [gr,gg,gb]=hexRgb(L.color);
    const glowA=.12+Math.sin(targetPulse)*.06;
    ctx.shadowColor='rgba('+gr+','+gg+','+gb+','+(glowA+.15)+')';
    ctx.shadowBlur=18+Math.sin(targetPulse)*8;
    ctx.drawImage(targetCanvas,targetX,targetY);
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
  }

  /* --- Mise à jour effets --- */
  updateEffects(dt);

  /* --- Rayon d'effacement adapté à la taille de la cible --- */
  const eraseR=Math.max(14,Math.min(28,targetW*.13));
  const paddleTop=H-24-paddle.h;

  /* --- Balles --- */
  for(let bi=0;bi<balls.length;bi++){
    const b=balls[bi];
    // Trail
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>10)b.trail.shift();
    // Mouvement
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.hitCd>0)b.hitCd-=dt;
    // Murs
    if(b.x<9){b.vx=Math.abs(b.vx);b.x=9;}
    if(b.x>W-9){b.vx=-Math.abs(b.vx);b.x=W-9;}
    if(b.y<9){b.vy=Math.abs(b.vy);b.y=9;}

    /* --- Paddle --- */
    if(b.vy>0&&b.y>=paddleTop&&b.y<=paddleTop+paddle.h+8&&b.x>=paddle.x-5&&b.x<=paddle.x+paddle.w+5){
      const hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      b.vx=hit*5*L.speed;
      b.vy=-Math.abs(b.vy);
      b.y=paddleTop-1;
    }

    /* =========================================================
       CORRECTION DU BUG : vérification d'un VOISINAGE + 
       comptage réel des pixels effacés (avant/après)
       ========================================================= */
    const lx=Math.floor(b.x-targetX);
    const ly=Math.floor(b.y-targetY);

    if(lx>=0&&lx<targetW&&ly>=0&&ly<targetH&&targetW>0&&targetH>0){
      // Zone de vérification = taille du cercle d'effacement
      const sx=Math.max(0,Math.floor(lx-eraseR));
      const sy=Math.max(0,Math.floor(ly-eraseR));
      const ex=Math.min(targetW,Math.ceil(lx+eraseR));
      const ey=Math.min(targetH,Math.ceil(ly+eraseR));
      const cw=ex-sx, ch=ey-sy;

      if(cw>0&&ch>0){
        // 1) Compter les pixels AVANT effacement dans cette zone
        const beforeData=tctx.getImageData(sx,sy,cw,ch).data;
        let beforeCount=0;
        for(let i=3;i<beforeData.length;i+=4){
          if(beforeData[i]>20)beforeCount++;
        }

        if(beforeCount>0&&b.hitCd<=0){
          // 2) Échantillonner la couleur moyenne pour les particules
          let sr=0,sg=0,sb=0,sc=0;
          for(let i=0;i<beforeData.length;i+=4){
            if(beforeData[i+3]>20){sr+=beforeData[i];sg+=beforeData[i+1];sb+=beforeData[i+2];sc++;}
          }
          const hitColor=sc>0?'rgb('+Math.round(sr/sc)+','+Math.round(sg/sc)+','+Math.round(sb/sc)+')':L.color;

          // 3) Effacer le cercle sur le canvas cible
          tctx.globalCompositeOperation='destination-out';
          tctx.beginPath();tctx.arc(lx,ly,eraseR,0,Math.PI*2);tctx.fill();
          tctx.globalCompositeOperation='source-over';

          // 4) Recompter les pixels APRÈS effacement dans la MÊME zone
          const afterData=tctx.getImageData(sx,sy,cw,ch).data;
          let afterCount=0;
          for(let i=3;i<afterData.length;i+=4){
            if(afterData[i]>20)afterCount++;
          }

          // 5) Mettre à jour avec la VRAIE différence
          const removed=beforeCount-afterCount;
          remainingPixels-=removed;
          if(remainingPixels<0)remainingPixels=0;

          // Combo & score
          combo++;comboTimer=50;
          const pts=10*Math.min(combo,8);
          score+=pts;
          document.getElementById('score').textContent=score;

          // Progression
          const pct=updateProgress();

          // Effets visuels
          spawnParticles(b.x,b.y,hitColor,6+combo*2);
          spawnImpact(b.x,b.y,L.color);
          spawnFloat(b.x,b.y-18,'+'+pts,combo>=3?'#FBBF24':'#10B981');
          screenFlash=.12;
          play('boom');

          // Power-up aléatoire
          if(Math.random()<.17){
            const types=['life','long','multi'];
            gifts.push({x:b.x,y:b.y,type:types[Math.floor(Math.random()*3)],vy:2.2});
          }

          // Rebond
          b.vy*=-1;
          b.hitCd=12;

          // Victoire ?
          if(pct>=90){winLevel();return;}
        }
      }
    }

    // Balle perdue en bas
    if(b.y>H+30){
      balls.splice(bi,1);bi--;
      if(balls.length===0){
        vies--;updateVies();play('lost');combo=0;
        if(vies<=0){gameOver();return;}
        else resetBalls();
      }
    }
  }

  /* --- Dessiner les trails --- */
  for(const b of balls){
    const len=b.trail.length;
    for(let i=0;i<len;i++){
      const p=b.trail[i];
      const a=(i/len)*.28;
      const s=2.5+(i/len)*5;
      ctx.globalAlpha=a;
      ctx.fillStyle=L.color;
      ctx.beginPath();ctx.arc(p.x,p.y,s,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  /* --- Effets (particules, anneaux, textes) --- */
  drawEffects();

  /* --- Dessiner les balles --- */
  for(const b of balls){
    ctx.shadowColor=L.color;ctx.shadowBlur=14;
    const grad=ctx.createRadialGradient(b.x-2,b.y-2,0,b.x,b.y,9);
    grad.addColorStop(0,'#ffffff');grad.addColorStop(.45,L.color);grad.addColorStop(1,'rgba(0,0,0,0.4)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(b.x,b.y,9,0,Math.PI*2);ctx.fill();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
  }

  /* --- Paddle --- */
  // Ombre portée
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();ctx.roundRect(paddle.x+2,paddleTop+5,paddle.w,paddle.h,7);ctx.fill();
  // Corps avec dégradé
  const pGrad=ctx.createLinearGradient(paddle.x,paddleTop,paddle.x,paddleTop+paddle.h);
  pGrad.addColorStop(0,'#ffffff');pGrad.addColorStop(1,'#94A3B8');
  ctx.fillStyle=pGrad;
  ctx.beginPath();ctx.roundRect(paddle.x,paddleTop,paddle.w,paddle.h,7);ctx.fill();
  // Glow si paddle allongé
  if(longTimer>0){
    ctx.shadowColor='#10B981';ctx.shadowBlur=16;
    ctx.strokeStyle='rgba(16,185,129,0.55)';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(paddle.x-1,paddleTop-1,paddle.w+2,paddle.h+2,8);ctx.stroke();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
  }

  /* --- Power-ups --- */
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=gifts.length-1;i>=0;i--){
    const g=gifts[i];g.y+=g.vy*dt;
    const ox=Math.sin(g.y*.1)*3;
    ctx.font='22px serif';
    ctx.fillText(g.type==='life'?'\u2764\uFE0F':g.type==='long'?'\uD83D\uDFE9':'\uD83D\uDD35',g.x+ox,g.y);
    if(g.y>=paddleTop&&g.y<=paddleTop+paddle.h+12&&g.x>paddle.x-12&&g.x<paddle.x+paddle.w+12){
      if(g.type==='life'){vies=Math.min(5,vies+1);updateVies();play('oneup');spawnFloat(g.x,g.y-20,'+1 Vie','#F43F5E');}
      if(g.type==='long'){paddle.w=180;longTimer=12*60;play('longer');spawnFloat(g.x,g.y-20,'Paddle +','#06B6D4');}
      if(g.type==='multi'){
        const sp=L.speed;
        balls.push({x:paddle.x+paddle.w/2,y:H-44,vx:3.5*sp,vy:-3.5*sp,trail:[],hitCd:0},{x:paddle.x+paddle.w/2,y:H-44,vx:-3.5*sp,vy:-3.5*sp,trail:[],hitCd:0});
        play('multi');spawnFloat(g.x,g.y-20,'Multi!','#A78BFA');
      }
      gifts.splice(i,1);
    }else if(g.y>H+40)gifts.splice(i,1);
  }

  /* --- Flash écran --- */
  if(screenFlash>0){
    ctx.fillStyle='rgba(16,185,129,'+Math.max(0,screenFlash)+')';
    ctx.fillRect(0,0,W,H);
  }

  /* --- Combo affiché --- */
  if(combo>=2){comboEl.textContent='x'+combo+' COMBO';comboEl.classList.add('show');}
  else comboEl.classList.remove('show');

  /* --- Timer paddle long --- */
  if(longTimer>0){longTimer-=dt;if(longTimer<=0)paddle.w=110;}
}

/* ===== OVERLAYS ===== */
function showOverlay(t,txt,cb){
  document.getElementById('ovTitle').textContent=t;
  document.getElementById('ovText').textContent=txt;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('ovBtn').onclick=cb;
}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}

function winLevel(){
  running=false;play('pass');
  if(levelIdx<LEVELS.length-1){
    showOverlay('Niveau '+(levelIdx+1)+' nettoy\u00e9 !','On passe au niveau '+(levelIdx+2)+' \u2014 '+LEVELS[levelIdx+1].name,
      ()=>{hideOverlay();loadLevel(levelIdx+1);running=true;last=performance.now();});
  }else{
    play('applause');
    showOverlay('Bravo, collection termin\u00e9e !','Tu as gu\u00e9ri les 4 maladies ! Score final : '+score,
      ()=>{hideOverlay();levelIdx=0;score=0;vies=5;document.getElementById('score').textContent=0;updateVies();loadLevel(0);running=true;last=performance.now();});
  }
}
function gameOver(){
  running=false;
  showOverlay('Perdu','Plus de vies ! Score : '+score,
    ()=>{hideOverlay();vies=5;score=0;document.getElementById('score').textContent=0;updateVies();loadLevel(levelIdx);running=true;last=performance.now();});
}

/* ===== CONTRÔLES ===== */
function handleMove(cx){
  const r=canvas.getBoundingClientRect();
  paddle.x=cx-r.left-paddle.w/2;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
}
canvas.addEventListener('touchmove',e=>{e.preventDefault();handleMove(e.touches[0].clientX);},{passive:false});
canvas.addEventListener('touchstart',e=>{e.preventDefault();handleMove(e.touches[0].clientX);},{passive:false});
canvas.addEventListener('mousemove',e=>handleMove(e.clientX));
canvas.addEventListener('mousedown',e=>handleMove(e.clientX));
document.getElementById('muteBtn').onclick=()=>setMuted(!muted);
document.getElementById('restartBtn').onclick=()=>{vies=5;score=0;document.getElementById('score').textContent=0;updateVies();loadLevel(levelIdx);running=true;last=performance.now();};

/* ===== DÉMARRAGE ===== */
updateVies();
resizeGame();
loadLevel(0);
running=true;
last=performance.now();
requestAnimationFrame(loop);
</script>
