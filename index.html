<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Flipbook</title>
    <link rel="stylesheet" href="style.css">
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Turn.js via CDN (ou ton fichier local) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4/turn.min.js"></script>
</head>
<body>

    <div id="upload-container">
        <label for="pdf-file-input" class="upload-btn">Choisir un PDF</label>
        <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;">
    </div>

    <div id="flipbook-container">
        <div id="flipbook">
            <!-- Les pages seront injectées ici -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
