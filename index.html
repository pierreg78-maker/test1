<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Fitness</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#070b14">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#070b14; font-family:system-ui,-apple-system,sans-serif; }
    #root { max-width:480px; margin:0 auto; background:#070b14; min-height:100vh; position:relative; }
    .header-logo { width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:transparent; border:none; }
    .intent-row { display:flex; flex-wrap:wrap; gap:8px; }
    .super-tag, .filter-tag { padding:6px 12px; border-radius:999px; font-size:12px; font-weight:500; }
    .filter-line { display:flex; flex-wrap:nowrap; align-items:center; gap:8px; overflow:hidden; }
    .filter-line.open { flex-wrap:wrap; }
    .term-mark { border-bottom:1px dotted #eab30899; cursor:help; }
    .term-pop { position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); width:min(260px,72vw); background:#12182b; border:1px solid #2e2a55; color:#cbd5e1; font-size:11px; padding:10px 12px; border-radius:12px; z-index:50; }
    .bpm-box { width:44px; height:44px; border-radius:10px; background:#22d3ee22; border:1px solid #22d3ee55; color:#67e8f9; text-align:center; font-size:15px; font-weight:600; }
    .tone-select { padding:8px 12px; font-size:12px; border-radius:10px; background:#0f1524; border:1px solid #1a2236; color:#94a3b8; }
    .vol-slider { -webkit-appearance:none; width:110px; height:4px; border-radius:2px; background:#1a2236; }
    .vol-slider::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#22d3ee; }
    .splash-overlay { position:fixed; inset:0; z-index:100; background:radial-gradient(circle at 50% 42%, #10162b 0%, #070b14 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.js?v=20260912c"></script>
</body>
</html>
