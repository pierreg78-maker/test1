<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cartes Postales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&family=Poppins:wght@600&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f23;--bg2:#161630;--fg:#e4e4f0;--muted:#6a6a90;--accent:#e07a5f;--accent2:#c96a52;--card:#1c1c3a;--border:#2a2a50}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;min-height:46px;z-index:20}
.hdr-t{font-family:'Dancing Script',cursive;font-size:20px;font-weight:700;color:var(--accent)}
.hdr-a{display:flex;gap:2px}
.hb{width:38px;height:38px;border:none;border-radius:8px;background:0 0;color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s}
.hb:active{background:var(--card);color:var(--fg)}
.hb.on{color:var(--accent);background:rgba(224,122,95,.12)}
.hb.dl{background:var(--accent);color:#fff}.hb.dl:active{background:var(--accent2)}

/* ZONE CARTE */
.ca{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px;position:relative;background:radial-gradient(ellipse at 50% 40%,#181838,var(--bg) 75%);touch-action:none}
.pc{position:relative;width:100%;max-width:540px;aspect-ratio:3/2;background:#f5e6d3;border-radius:3px;box-shadow:0 6px 30px rgba(0,0,0,.5);overflow:visible;touch-action:none}
.pc-bg{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:3px}
.pc-el{position:absolute;inset:0;overflow:visible;border-radius:3px}
.pc-st{position:absolute;top:8px;right:8px;width:56px;height:56px;border:2.5px solid rgba(0,0,0,.15);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font-family:'Courier New',monospace;color:rgba(0,0,0,.18);pointer-events:none;transition:opacity .2s;line-height:1.1}
.pc-st span:first-child{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pc-st span:last-child{font-size:6px}
.pc-st.off{opacity:0}

/* ELEMENTS */
.el{position:absolute;cursor:move;z-index:5;touch-action:none;animation:elIn .15s ease-out}
.el.sel{z-index:10}
.el.sel::after{content:'';position:absolute;inset:-4px;border:2px dashed var(--accent);border-radius:5px;pointer-events:none}
@keyframes elIn{from{opacity:0;transform:scale(.7) rotate(0deg)}to{opacity:1}}

/* BULLES */
.bbl{padding:10px 14px;min-width:50px;min-height:28px;display:inline-block;max-width:180px;word-wrap:break-word;text-align:center;position:relative}
.bbl-r{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.bbl-r::after{content:'';position:absolute;bottom:-9px;left:16px;border:7px solid transparent;border-top-color:#fff}
.bbl-p{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.bbl-p::after{content:'';position:absolute;bottom:-12px;left:20px;width:9px;height:9px;background:#fff;border-radius:50%}
.bbl-p::before{content:'';position:absolute;bottom:-21px;left:12px;width:5px;height:5px;background:#fff;border-radius:50%}
.bbl-s{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.bbl-s::after{content:'';position:absolute;top:50%;right:-9px;transform:translateY(-50%);border:7px solid transparent;border-left-color:#fff}
.bbl-t{font-size:14px;line-height:1.3;outline:none;color:#333;font-family:'Dancing Script',cursive}
.el-tx{white-space:pre-wrap;outline:none;text-shadow:0 1px 3px rgba(0,0,0,.12)}

/* BARRE FLOTTANTE */
.fb{position:fixed;bottom:220px;left:50%;transform:translateX(-50%) translateY(8px);display:flex;gap:3px;padding:5px 7px;background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:all .2s}
.fb.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.fbb{width:36px;height:36px;border:none;border-radius:7px;background:0 0;color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fbb:active{background:var(--accent);color:#fff}
.fbb.dd:active{background:#e74c3c;color:#fff}

/* PANNEAU BAS */
.bp{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);z-index:30;display:flex;flex-direction:column;height:210px;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:7px 2px 5px;border:none;background:0 0;color:var(--muted);font-size:9px;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .1s;border-bottom:2px solid transparent}
.tab i{font-size:14px}
.tab:active{background:var(--card)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tc{flex:1;overflow:hidden;position:relative}
.tp{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;overflow-y:auto;overflow-x:hidden;padding:7px 10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tp::-webkit-scrollbar{display:none}

.st{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:5px 0 5px}
.st:first-child{margin-top:0}

/* Couleurs */
.cr{display:flex;gap:4px;flex-wrap:wrap}
.cs{width:28px;height:28px;border-radius:5px;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform .08s}
.cs:active{transform:scale(.88)}
.cs.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg2)}
.cc{width:28px;height:28px;border-radius:5px;border:2px dashed var(--border);background:0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;flex-shrink:0}
.cc:active{border-color:var(--accent);color:var(--accent)}

/* Photos */
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pb{border-radius:5px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:transform .08s;aspect-ratio:3/2;background:var(--card)}
.pb:active{transform:scale(.94)}
.pb.on{border-color:var(--accent)}
.pb img{width:100%;height:100%;object-fit:cover;display:block}
.ub{width:100%;padding:8px;border:2px dashed var(--border);border-radius:7px;background:0 0;color:var(--muted);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif}
.ub:active{border-color:var(--accent);color:var(--accent)}

/* Filtres */
.fr{display:flex;gap:4px;overflow-x:auto;touch-action:pan-x;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.fr::-webkit-scrollbar{display:none}
.fb2{flex-shrink:0;width:54px;height:38px;border-radius:5px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:transform .08s;position:relative;background:var(--card)}
.fb2:active{transform:scale(.94)}
.fb2.on{border-color:var(--accent)}
.fb2 img{width:100%;height:100%;object-fit:cover}
.fb2 span{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);padding:1px 0}

/* Emojis */
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:0}
.eb{aspect-ratio:1;border:none;border-radius:7px;background:0 0;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .08s,transform .08s}
.eb:active{background:var(--card);transform:scale(.86)}

/* Formes */
.shg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shb{aspect-ratio:1;border:2px solid var(--border);border-radius:8px;background:0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .1s,transform .08s;padding:8px}
.shb:active{border-color:var(--accent);transform:scale(.92)}
.bo{display:flex;gap:6px;margin-bottom:6px}
.bob{flex:1;padding:10px 6px;border:2px solid var(--border);border-radius:8px;background:0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .1s;color:var(--muted);font-family:'DM Sans',sans-serif}
.bob:active{border-color:var(--accent);color:var(--accent)}
.bob span{font-size:8px}
.bi{width:36px;height:24px;background:#fff;position:relative;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.bi.t::after{content:'';position:absolute;bottom:-6px;left:8px;border:5px solid transparent;border-top-color:#fff}
.bi.p{border-radius:10px}
.bi.p::after{content:'';position:absolute;bottom:-9px;left:12px;width:7px;height:7px;background:#fff;border-radius:50%}
.bi.p::before{content:'';position:absolute;bottom:-15px;left:6px;width:4px;height:4px;background:#fff;border-radius:50%}
.bi.s{border-radius:10px}
.bi.s::after{content:'';position:absolute;top:50%;right:-6px;transform:translateY(-50%);border:5px solid transparent;border-left-color:#fff}

/* Texte panel */
.ti{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--fg);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:6px}
.ti:focus{border-color:var(--accent)}
.fo{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.fob{padding:5px 8px;border:1px solid var(--border);border-radius:5px;background:0 0;color:var(--muted);font-size:11px;cursor:pointer;transition:all .08s}
.fob:active{border-color:var(--accent);color:var(--accent)}
.fob.on{border-color:var(--accent);color:var(--accent);background:rgba(224,122,95,.1)}
.so{display:flex;gap:3px;margin-bottom:4px}
.sb{padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:0 0;color:var(--muted);font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .08s}
.sb:active{border-color:var(--accent);color:var(--accent)}
.sb.on{border-color:var(--accent);color:var(--accent);background:rgba(224,122,95,.1)}
.ab{width:100%;padding:9px;border:none;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px}
.ab:active{background:var(--accent2)}

/* MODALE */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100}
.mo.show{display:flex}
.mb{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px;width:85%;max-width:300px}
.mb label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px}
.mi{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--fg);font-size:14px;outline:none;font-family:'DM Sans',sans-serif;margin-bottom:10px}
.mi:focus{border-color:var(--accent)}
.ma{display:flex;gap:6px;justify-content:flex-end}
.meb{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:0 0;color:var(--fg);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif}
.meb:active{background:var(--card)}
.meb.pr{background:var(--accent);border-color:var(--accent);color:#fff}
.meb.pr:active{background:var(--accent2)}

/* TOAST */
.toast{position:fixed;top:52px;left:50%;transform:translateX(-50%) translateY(-12px);background:var(--card);border:1px solid var(--border);color:var(--fg);padding:7px 14px;border-radius:8px;font-size:11px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#hp{position:absolute;opacity:0;width:0;height:0;pointer-events:none}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:360px){.eg{grid-template-columns:repeat(6,1fr)}.eb{font-size:19px}.pg{grid-template-columns:repeat(3,1fr)}.bp{height:190px}}
</style>
</head>
<body>

<header class="hdr">
<span class="hdr-t">La nouvelle carte postale</span>
<div class="hdr-a">
<button class="hb on" id="stBtn" onclick="toggleStamp()" aria-label="Tampon"><i class="fas fa-stamp"></i></button>
<button class="hb" onclick="shareCard()" aria-label="Partager"><i class="fas fa-share-nodes"></i></button>
<button class="hb dl" onclick="exportPNG()" aria-label="Telecharger"><i class="fas fa-download"></i></button>
</div>
</header>

<main class="ca">
<div class="pc" id="pc">
<div class="pc-bg" id="pcBg"></div>
<div class="pc-el" id="pcEl"></div>
<div class="pc-st" id="pcSt"><span>POSTE</span><span id="stDt"></span></div>
</div>
</main>

<div class="fb" id="fbar">
<button class="fbb" onclick="scaleEl(1.25)" aria-label="Agrandir"><i class="fas fa-plus"></i></button>
<button class="fbb" onclick="scaleEl(0.8)" aria-label="Reduire"><i class="fas fa-minus"></i></button>
<button class="fbb" onclick="rotEl(15)" aria-label="Tourner"><i class="fas fa-rotate-right"></i></button>
<button class="fbb dd" onclick="delEl()" aria-label="Supprimer"><i class="fas fa-trash"></i></button>
</div>

<div class="bp">
<nav class="tabs">
<button class="tab on" data-t="bg" onclick="swTab('bg')"><i class="fas fa-image"></i><span>Fond</span></button>
<button class="tab" data-t="em" onclick="swTab('em')"><i class="fas fa-face-smile"></i><span>Emojis</span></button>
<button class="tab" data-t="bb" onclick="swTab('bb')"><i class="fas fa-comment-dots"></i><span>Bulles</span></button>
<button class="tab" data-t="tx" onclick="swTab('tx')"><i class="fas fa-font"></i><span>Texte</span></button>
<button class="tab" data-t="sh" onclick="swTab('sh')"><i class="fas fa-shapes"></i><span>Formes</span></button>
</nav>
<div class="tc">
<div class="tp" id="p-bg"></div>
<div class="tp" id="p-em" style="display:none"></div>
<div class="tp" id="p-bb" style="display:none"></div>
<div class="tp" id="p-tx" style="display:none"></div>
<div class="tp" id="p-sh" style="display:none"></div>
</div>
</div>

<div class="mo" id="editMo">
<div class="mb">
<label>Modifier le texte</label>
<input class="mi" id="editIn" type="text" maxlength="100">
<div class="ma">
<button class="meb" onclick="closeEdit()">Annuler</button>
<button class="meb pr" onclick="confirmEdit()">OK</button>
</div>
</div>
</div>

<input type="color" id="hp" value="#f5e6d3">
<input type="color" id="shp" value="#9aa0a6">
<input type="file" id="fileIn" accept="image/*" style="display:none">

<script>
/* ============================================================
   CARTES POSTALES — Créateur mobile
   ============================================================ */

// === Données ===
var BG_C = ['#f5e6d3','#e8d5b7','#fce4ec','#e3f2fd','#e8f5e9','#fff8e1','#f3e5f5','#d7ccc8','#fff3e0','#1a1a2e','#2c3e50','#0d1b2a','#fdf2e9','#eaecee','#f9e7e7'];
var PHOTOS = [10,15,28,29,36,37,42,47,54,65,66,69,76,82,89,96,101,106,129,134,155,167];
var FILTS = [{n:'Aucun',c:'none'},{n:'Sepia',c:'sepia(.8)'},{n:'N&B',c:'grayscale(1)'},{n:'Vintage',c:'sepia(.4) saturate(1.3) contrast(1.1)'},{n:'Chaud',c:'saturate(1.4) brightness(1.05)'},{n:'Froid',c:'saturate(.8) brightness(1.05) hue-rotate(15deg)'},{n:'Contraste',c:'contrast(1.4)'}];
var EMOJIS = ['😀','😊','😂','🥰','😍','😘','😎','🤗','🥳','😋','🤔','😅','😢','😭','🥺','😤','😡','🤩','🥹','😴','🐶','🐱','🐰','🦊','🐻','🐼','🐨','🦁','🐯','🐮','🐷','🐸','🦋','🐝','🐌','🦄','🐙','🐢','🐠','🦜','🌸','🌺','🌻','🌹','🌷','🍀','🌿','🌲','🌴','🌵','🍁','🍂','🌊','⛰️','🌈','☀️','🌙','⭐','❤️','💝','💖','💕','🫶','🤍','💗','🏠','✈️','🚗','🚲','⛵','🎈','🎁','🎵','🎨','📸','☕','🎂','🍰','📮'];
var BBL_C = ['#ffffff','#fff8e7','#fffde7','#fce4ec','#e3f2fd','#e8f5e9','#f3e5f5','#1a1a2e'];
var FONTS = [{n:'Manuscrite',v:"'Dancing Script',cursive"},{n:'Elégante',v:"'Playfair Display',serif"},{n:'Moderne',v:"'Poppins',sans-serif"},{n:'Fluide',v:"'Sacramento',cursive"}];
var SIZES = [{n:'Petit',v:16},{n:'Moyen',v:24},{n:'Grand',v:36},{n:'Très grand',v:48}];
var TX_C = ['#000000','#333333','#ffffff','#c0392b','#e07a5f','#f39c12','#27ae60','#2980b9','#8e44ad','#e91e63'];
var SHAPES = [{n:'Cercle',k:'circle'},{n:'Carré',k:'square'},{n:'Triangle',k:'triangle'},{n:'Hexagone',k:'hexagon'},{n:'Étoile',k:'star'},{n:'Flèche',k:'arrow'}];
var SHAPE_C = ['#9aa0a6','#000000','#f2c230','#e63950','#2ecc71','#2980b9','#8e44ad','#ffffff'];

// === État ===
var els = [];
var selId = null;
var bgType = 'color';
var bgColor = '#f5e6d3';
var bgImg = null;
var bgFilter = 'none';
var showSt = true;
var bblClr = '#ffffff';
var txFont = FONTS[0].v;
var txSz = 24;
var txClr = '#000000';
var shColor = '#9aa0a6';
var drag = null;
var editId = null;
var idC = 0;
var lastTap = 0;
var lastTapId = '';

// === Init ===
function init() {
    var d = new Date();
    document.getElementById('stDt').textContent = pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();

    buildBg();
    buildEm();
    buildBb();
    buildTx();
    buildSh();
    applyBg();

    document.getElementById('hp').addEventListener('input', function(e) { setBgClr(e.target.value); });
    document.getElementById('shp').addEventListener('input', function(e) { setShClr(e.target.value); });
    document.getElementById('fileIn').addEventListener('change', function(e) {
        var f = e.target.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function(ev) {
            var img = new Image();
            img.onload = function() { bgImg = img; bgType = 'photo'; bgFilter = 'none'; applyBg(); showFlt(); };
            img.src = ev.target.result;
        };
        r.readAsDataURL(f);
        e.target.value = '';
    });

    document.getElementById('pcEl').addEventListener('click', function(e) {
        if (e.target === this) desel();
    });

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('touchend', onUp);
    document.addEventListener('touchcancel', onUp);

    document.addEventListener('keydown', function(e) {
        if ((e.key === 'Delete' || e.key === 'Backspace') && selId && document.activeElement.tagName !== 'INPUT') { delEl(); e.preventDefault(); }
        if (e.key === 'Escape') { desel(); closeEdit(); }
    });
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

// === Construction panneaux ===
function buildBg() {
    var h = '';
    h += '<div class="st">Importer une photo</div><button class="ub" onclick="document.getElementById(\'fileIn\').click()"><i class="fas fa-cloud-arrow-up"></i> Choisir une photo</button>';

    h += '<div class="st" id="fltT" style="display:none">Filtres</div><div class="fr" id="fltR" style="display:none">';
    for (var i = 0; i < FILTS.length; i++) {
        var f = FILTS[i];
        h += '<button class="fb2' + (i === 0 ? ' on' : '') + '" data-f="' + f.c + '" onclick="setFlt(\'' + f.c + '\',this)"><img src="https://picsum.photos/id/47/54/38" style="filter:' + f.c + '" alt="" loading="lazy"><span>' + f.n + '</span></button>';
    }
    h += '</div>';

    h += '<div class="st">Couleur unie</div><div class="cr" id="bgCr">';
    for (var i = 0; i < BG_C.length; i++) {
        var c = BG_C[i];
        var bdr = isLight(c) ? 'border:2px solid ' + (c === bgColor ? 'var(--accent)' : 'var(--border)') : '';
        h += '<div class="cs' + (c === bgColor ? ' on' : '') + '" style="background:' + c + ';' + bdr + '" data-hex="' + c + '" onclick="setBgClr(\'' + c + '\')"></div>';
    }
    h += '<button class="cc" onclick="document.getElementById(\'hp\').click()"><i class="fas fa-palette"></i></button></div>';

// === Création DOM ===
function mkDom(el) {
    var div = document.createElement('div');
    div.className = 'el';
    div.id = 'd-' + el.id;
    div.setAttribute('data-id', el.id);
    div.style.left = el.x + 'px';
    div.style.top = el.y + 'px';
    div.style.transform = 'rotate(' + el.rot + 'deg) scale(' + el.sc + ')';

    if (el.type === 'em') {
        div.textContent = el.em;
        div.style.fontSize = el.fs + 'px';
        div.style.lineHeight = '1';
        div.style.filter = 'drop-shadow(0 1px 2px rgba(0,0,0,.2))';
    } else if (el.type === 'bb') {
        var bbl = document.createElement('div');
        bbl.className = 'bbl bbl-' + el.st;
        bbl.style.background = el.bg;
        var sp = document.createElement('span');
        sp.className = 'bbl-t';
        sp.style.color = el.clr;
        sp.style.fontFamily = el.font;
        sp.textContent = el.text;
        bbl.appendChild(sp);
        div.appendChild(bbl);
    } else if (el.type === 'tx') {
        var sp = document.createElement('span');
        sp.className = 'el-tx';
        sp.style.color = el.clr;
        sp.style.fontFamily = el.font;
        sp.style.fontSize = el.fs + 'px';
        sp.textContent = el.text;
        div.appendChild(sp);
    } else if (el.type === 'sh') {
        div.innerHTML = shapeSVG(el.shape, el.clr, el.size);
        div.style.filter = 'drop-shadow(0 1px 2px rgba(0,0,0,.2))';
    }

    div.addEventListener('mousedown', function(e) { startDrag(e, el.id); });
    div.addEventListener('touchstart', function(e) { startDrag(e, el.id); }, {passive:false});

    // Double tap pour éditer
    div.addEventListener('mouseup', function() { handleTap(el); });
    div.addEventListener('touchend', function() { handleTap(el); });

    document.getElementById('pcEl').appendChild(div);
}

function handleTap(el) {
    if (drag && drag.moved) return;
    var now = Date.now();
    if (now - lastTap < 400 && lastTapId === el.id && (el.type === 'bb' || el.type === 'tx')) {
        openEdit(el.id);
        lastTap = 0; lastTapId = '';
        return;
    }
    lastTap = now; lastTapId = el.id;
}

// === Drag ===
function startDrag(e, id) {
    e.preventDefault(); e.stopPropagation();
    sel(id);
    var el = findEl(id); if (!el) return;
    var cx, cy;
    if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    drag = {id:id, sx:cx, sy:cy, ox:el.x, oy:el.y, moved:false};
}

function onMove(e) {
    if (!drag) return;
    e.preventDefault();
    var cx, cy;
    if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    var dx = cx - drag.sx, dy = cy - drag.sy;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
    var el = findEl(drag.id); if (!el) return;
    var pc = document.getElementById('pc');
    el.x = Math.max(-20, Math.min(pc.offsetWidth - 20, drag.ox + dx));
    el.y = Math.max(-20, Math.min(pc.offsetHeight - 20, drag.oy + dy));
    var dom = document.getElementById('d-' + el.id);
    if (dom) { dom.style.left = el.x + 'px'; dom.style.top = el.y + 'px'; }
}

function onUp() { drag = null; }

// === Rendu carte (utilisé par téléchargement + partage) ===
function renderCardCanvas() {
    var W = 1500, H = 1000;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    var pc = document.getElementById('pc');
    var sx = W / pc.offsetWidth, sy = H / pc.offsetHeight;

    // Fond
    if (bgType === 'color') {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, W, H);
    } else if (bgType === 'photo' && bgImg && bgImg.complete) {
        try { ctx.filter = bgFilter === 'none' ? 'none' : bgFilter; } catch(er) {}
        var ir = bgImg.width / bgImg.height, cr = W / H;
        var dw, dh, dx, dy;
        if (ir > cr) { dh = H; dw = H * ir; dx = (W - dw) / 2; dy = 0; }
        else { dw = W; dh = W / ir; dx = 0; dy = (H - dh) / 2; }
        ctx.drawImage(bgImg, dx, dy, dw, dh);
        try { ctx.filter = 'none'; } catch(er) {}
    }

    // Tampon
    if (showSt) {
        ctx.save();
        ctx.translate(W - 80 * sx, 70 * sy);
        ctx.rotate(-12 * Math.PI / 180);
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 40 * Math.min(sx,sy), 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'bold ' + (11 * Math.min(sx,sy)) + 'px "Courier New",monospace';
        ctx.fillText('POSTE', 0, -5 * Math.min(sx,sy));
        ctx.font = (7 * Math.min(sx,sy)) + 'px "Courier New",monospace';
        var d = new Date();
        ctx.fillText(pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(), 0, 9 * Math.min(sx,sy));
        ctx.restore();
    }

    // Éléments
    for (var i = 0; i < els.length; i++) {
        var el = els[i];
        var dom = document.getElementById('d-' + el.id);
        if (!dom) continue;
        ctx.save();
        var cx_ = (el.x + dom.offsetWidth / 2) * sx;
        var cy_ = (el.y + dom.offsetHeight / 2) * sy;
        ctx.translate(cx_, cy_);
        ctx.rotate(el.rot * Math.PI / 180);
        ctx.scale(el.sc, el.sc);

        if (el.type === 'em') {
            ctx.font = el.fs * sx + 'px serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(el.em, 0, 0);
        } else if (el.type === 'bb') {
            var bw = dom.offsetWidth * sx, bh = dom.offsetHeight * sy;
            var bbl = dom.querySelector('.bbl');
            var tailH = el.st === 'r' ? 10 : el.st === 'p' ? 18 : 0;
            var totalH = bh + tailH * sy;
            var rad = 16 * sx;

            ctx.fillStyle = el.bg;
            drawRR(ctx, -bw/2, -totalH/2, bw, bh, rad);
            ctx.fill();

            // Queue
            if (el.st === 'r') {
                ctx.beginPath();
                ctx.moveTo(-bw/2 + 25*sx, -totalH/2 + bh);
                ctx.lineTo(-bw/2 + 16*sx, -totalH/2 + bh + 10*sy);
                ctx.lineTo(-bw/2 + 40*sx, -totalH/2 + bh);
                ctx.closePath(); ctx.fill();
            } else if (el.st === 'p') {
                ctx.beginPath(); ctx.arc(-bw/2 + 22*sx, -totalH/2 + bh + 8*sy, 5*sx, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-bw/2 + 12*sx, -totalH/2 + bh + 16*sy, 3*sx, 0, Math.PI*2); ctx.fill();
            } else if (el.st === 's') {
                ctx.beginPath();
                ctx.moveTo(bw/2, -9*sy);
                ctx.lineTo(bw/2 + 11*sx, 0);
                ctx.lineTo(bw/2, 9*sy);
                ctx.closePath(); ctx.fillStyle = el.bg; ctx.fill();
            }

            // Texte bulle
            ctx.fillStyle = el.clr;
            ctx.font = el.fs * sx + 'px ' + el.font;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            var lines = wrapTxt(ctx, el.text, bw - 24*sx);
            var lh = el.fs * 1.3 * sx;
            var startY = -((lines.length - 1) * lh) / 2;
            for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], 0, startY + j * lh);

        } else if (el.type === 'tx') {
            ctx.fillStyle = el.clr;
            ctx.font = el.fs * sx + 'px ' + el.font;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(el.text, 0, 0);
        } else if (el.type === 'sh') {
            drawShape(ctx, el.shape, el.clr, el.size * Math.min(sx, sy));
        }
        ctx.restore();
    }

    return canvas;
}

// === Téléchargement ===
function exportPNG() {

    var a = document.createElement('a');
    a.download = 'carte-postale.png';

    a.click();
    toast('Carte postale téléchargée !');
    vib(10);
}

// === Partage natif (WhatsApp, e-mail, etc.) ===
function shareCard() {
    var canvas = renderCardCanvas();
    canvas.toBlob(function(blob) {
        if (!blob) { toast('Erreur, réessayez'); return; }
        var file = new File([blob], 'carte-postale.png', {type:'image/png'});
        if (navigator.canShare && navigator.canShare({files:[file]})) {
            navigator.share({
                files: [file],
                title: 'Ma carte postale',
                text: 'Voici ma carte postale !'
            }).then(function() { vib(10); }).catch(function(e) {
                if (e && e.name !== 'AbortError') toast('Partage annulé');
            });
        } else {
            toast('Partage indisponible ici, téléchargement...');
            exportPNG();
        }
    }, 'image/png');
}

function drawShape(ctx, k, color, size) {
    var s = size / 100;
    ctx.fillStyle = color;
    ctx.beginPath();
    if (k === 'circle') {
        ctx.arc(0, 0, 46 * s, 0, Math.PI * 2);
    } else {
        var pts = SHAPE_PTS[k];
        for (var i = 0; i < pts.length; i++) {
            var px = (pts[i][0] - 50) * s, py = (pts[i][1] - 50) * s;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
    }
    ctx.fill();
}

function drawRR(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function wrapTxt(ctx, text, maxW) {
    var words = text.split(' ');
    var lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
        var test = line ? line + ' ' + words[i] : words[i];
        if (ctx.measureText(test).width > maxW && line) {
            lines.push(line); line = words[i];
        } else line = test;
    }
    if (line) lines.push(line);
    return lines.length ? lines : [''];
}

// === Utilitaires ===
function findEl(id) {
    for (var i = 0; i < els.length; i++) { if (els[i].id === id) return els[i]; }
    return null;
}
function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }
function toast(msg) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.classList.add('show'); }, 10);
    setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 2200);
}

// === Démarrage ===
init();
