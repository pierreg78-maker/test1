<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attrape-souris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #2c5f2d;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .game-info {
            background: white;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .game-info span {
            color: #2c5f2d;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            font-size: 1.2rem;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        #startBtn {
            background: #4CAF50;
            color: white;
        }

        #startBtn:hover {
            background: #45a049;
        }

        #pauseBtn {
            background: #FF9800;
            color: white;
            display: none;
        }

        #pauseBtn:hover {
            background: #F57C00;
        }

        .difficulty-btn {
            background: #FFC107;
            color: #333;
        }

        .difficulty-btn.active {
            background: #FF9800;
            color: white;
        }

        /* HABILLAGE BRIQUES ROUGES */
        .game-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 600px;
            width: 100%;
            padding: 25px;
            background-color: #a13d2d;
            background-image: 
                linear-gradient(0deg, #d3543f 50%, transparent 50%),
                linear-gradient(90deg, #d3543f 50%, #a13d2d 50%);
            background-size: 50px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 8px solid #702a1f;
        }

        .hole {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #3d2817;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            border: 4px solid #5c3a1e;
            cursor: pointer;
        }

        .mole {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 80%;
            background: #8B4513;
            border-radius: 50% 50% 45% 45%;
            transition: bottom 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .mole.mouse::before {
            content: "🐹";
        }

        .mole.cat::before {
            content: "🐱";
        }

        .mole.up {
            bottom: 10%;
        }

        .mole.hit {
            background: #ff6b6b;
        }

        .mole.hit::before {
            content: "💫";
        }

        .hole::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
        }

        .score-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: popUp 0.5s ease-out forwards;
            z-index: 20;
        }

        .score-popup.negative {
            color: #ff4757;
        }

        @keyframes popUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5); }
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .game-over.show {
            display: flex;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .game-over-content h2 {
            color: #2c5f2d;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .game-over-content p {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #333;
        }

        .final-score {
            font-size: 3rem;
            color: #FF9800;
            font-weight: bold;
            margin: 20px 0;
        }

        .instructions {
            background: rgba(255,255,255,0.9);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1rem;
            color: #555;
            max-width: 600px;
        }

        button:focus, .hole:focus {
            outline: 3px solid #FF9800;
            outline-offset: 2px;
        }

        @media (max-width: 600px) {
            .game-container {
                gap: 15px;
                padding: 15px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .game-info {
                font-size: 1rem;
                gap: 20px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div style="position: absolute; top: 5px; left: 5px">
      <a href="https://pierreg78-maker.github.io/Atelier/" style="display: inline-block; padding: 6px 10px; background-color: #6BA3FF; color: white; text-decoration: none; border-radius: 50px; font-family: Arial, sans-serif; font-size: 10px; font-weight: normal; text-align: center; position: absolute; top: 20px; left: 20px;">
        Retour à l'accueil
      </a>
    </div>
    <h1>&#128000 Attrapez la souris !</h1>
    
    <div class="instructions">
        Tapez sur la souris (&#128000) pour marquer des points, mais attention au chat (&#128043) qui fait perdre des points !
    </div>

    <div class="game-info">
        <div>Score: <span id="score">0</span></div>
        <div>Temps: <span id="time">30</span>s</div>
        <div>Meilleur Score: <span id="highScore">0</span></div>
    </div>

    <div class="controls">
        <button id="startBtn" onclick="startGame()">▶ Commencer</button>
        <button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
        <button class="difficulty-btn active" onclick="setDifficulty('easy')" id="btn-easy">Facile</button>
        <button class="difficulty-btn" onclick="setDifficulty('medium')" id="btn-medium">Moyen</button>
        <button class="difficulty-btn" onclick="setDifficulty('hard')" id="btn-hard">Difficile</button>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="hole" onclick="whack(this)" data-index="0"><div class="mole mouse"></div></div>
        <div class="hole" onclick="whack(this)" data-index="1"><div class="mole mouse"></div></div>
        <div class="hole" onclick="whack(this)" data-index="2"><div class="mole mouse"></div></div>
        <div class="hole" onclick="whack(this)" data-index="3"><div class="mole mouse"></div></div>
        <div class="hole" onclick="whack(this)" data-index="4"><div class="mole mouse"></div></div>
        <div class="hole" onclick="whack(this)" data-index="5"><div class="mole mouse"></div></div>
        <div class="hole" onclick="whack(this)" data-index="6"><div class="mole mouse"></div></div>
        <div class="hole" onclick="whack(this)" data-index="7"><div class="mole mouse"></div></div>
        <div class="hole" onclick="whack(this)" data-index="8"><div class="mole mouse"></div></div>
    </div>

    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2>🎉 Temps écoulé !</h2>
            <p>Votre score final:</p>
            <div class="final-score" id="finalScore">0</div>
            <p id="feedback">Bien joué</p>
            <button onclick="closeGameOver()" style="background: #4CAF50; color: white; margin-top: 20px;">Jouer à nouveau</button>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let isPaused = false;
        let timerInterval;
        let moleTimeout;
        let currentMole = null;
        let difficulty = 'easy';
        let highScore = localStorage.getItem('whackamole_highscore') || 0;
        
        // Audio Context pour les sons synthétisés
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Bruitage Bing! (Clic réussi)
        function playBingSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Note D5
            osc.frequency.exponentialRampToValueAtTime(1174.66, audioCtx.currentTime + 0.15); // Monte vers D6
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // Bruitage Wizzz! (Souris qui s'échappe / chat)
        function playWizzSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        const difficulties = {
            easy: { minTime: 1500, maxTime: 2500, stayTime: 2000 },
            medium: { minTime: 800, maxTime: 1500, stayTime: 1500 },
            hard: { minTime: 400, maxTime: 1000, stayTime: 1000 }
        };

        document.getElementById('highScore').textContent = highScore;

        function setDifficulty(level) {
            if (gameActive) return;
            difficulty = level;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + level).classList.add('active');
        }

        function startGame() {
            if (gameActive) return;
            initAudio();
            
            score = 0;
            timeLeft = 30;
            gameActive = true;
            isPaused = false;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('time').textContent = '30';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').textContent = '⏸ Pause';
            
            document.querySelectorAll('.mole').forEach(mole => {
                mole.classList.remove('up', 'hit', 'mouse', 'cat');
            });
            
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    document.getElementById('time').textContent = timeLeft;
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);
            
            spawnMole();
        }

        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPaused) {
                pauseBtn.textContent = '▶ Reprendre';
                if (currentMole) currentMole.classList.remove('up');
                clearTimeout(moleTimeout);
            } else {
                pauseBtn.textContent = '⏸ Pause';
                spawnMole();
            }
        }

        function spawnMole() {
            if (!gameActive || isPaused) return;
            
            if (currentMole) {
                currentMole.classList.remove('up');
            }
            
            const holes = document.querySelectorAll('.hole');
            const randomHole = holes[Math.floor(Math.random() * holes.length)];
            const mole = randomHole.querySelector('.mole');
            
            // 25% de chance d'avoir un chat 🐱 au lieu d'une souris 🐹
            const isCat = Math.random() < 0.25;
            mole.className = 'mole ' + (isCat ? 'cat' : 'mouse');
            
            mole.classList.remove('hit');
            mole.classList.add('up');
            currentMole = mole;
            
            const settings = difficulties[difficulty];
            
            setTimeout(() => {
                if (mole.classList.contains('up') && !mole.classList.contains('hit')) {
                    mole.classList.remove('up');
                    if (!isCat && gameActive && !isPaused) {
                        playWizzSound(); // Souris qui s'échappe
                    }
                }
            }, settings.stayTime);
            
            const nextTime = Math.random() * (settings.maxTime - settings.minTime) + settings.minTime;
            moleTimeout = setTimeout(spawnMole, nextTime);
        }

        function whack(hole) {
            if (!gameActive || isPaused) return;
            
            const mole = hole.querySelector('.mole');
            
            if (mole.classList.contains('up') && !mole.classList.contains('hit')) {
                const isCat = mole.classList.contains('cat');
                
                // Visual feedback & Points
                const popup = document.createElement('div');
                popup.className = 'score-popup';
                
                if (isCat) {
                    // C'est un chat -> Malus !
                    score -= 15;
                    playWizzSound();
                    popup.textContent = '-15';
                    popup.classList.add('negative');
                } else {
                    // C'est une souris -> Bonus !
                    score += 10;
                    playBingSound();
                    popup.textContent = '+10';
                }
                
                document.getElementById('score').textContent = score;
                mole.classList.add('hit');
                hole.appendChild(popup);
                setTimeout(() => popup.remove(), 500);
                
                setTimeout(() => {
                    mole.classList.remove('up', 'hit');
                }, 300);
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            clearTimeout(moleTimeout);
            
            document.querySelectorAll('.mole').forEach(mole => {
                mole.classList.remove('up', 'hit');
            });
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('whackamole_highscore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            document.getElementById('finalScore').textContent = score;
            
            const feedback = document.getElementById('feedback');
            if (score >= 150) feedback.textContent = '🏆 Fabuleux ! Excellents réflexes !';
            else if (score >= 100) feedback.textContent = '⭐ Bravo ! Continuez l\'entraînement !';
            else if (score >= 50) feedback.textContent = '👍 Belle tentative ! Essayez encore !';
            else feedback.textContent = '💪 Bien joué ! Il faut encore s\'entraîner pour devenir parfait !';
            
            document.getElementById('gameOver').classList.add('show');
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function closeGameOver() {
            document.getElementById('gameOver').classList.remove('show');
        }

        document.querySelectorAll('.hole').forEach(hole => {
            hole.setAttribute('tabindex', '0');
            hole.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    whack(hole);
                }
            });
        });
    </script>
</body>
</html>
